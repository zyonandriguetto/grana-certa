<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoria')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>

<main class="container py-4" style="max-width: 720px">
    <a th:href="@{/categorias}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Voltar</a>
    <h1 class="h3 mt-2 mb-4" th:text="${categoria.id == null} ? 'Nova categoria' : 'Editar categoria'">Categoria</h1>

    <form th:action="@{/categorias}" th:object="${categoria}" method="post" class="gc-card p-4" novalidate>
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
            <div class="col-md-8">
                <label class="form-label" for="nome">Nome</label>
                <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid" placeholder="Ex.: Transporte">
                <div class="invalid-feedback" th:errors="*{nome}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="cor">Cor</label>
                <input type="color" class="form-control form-control-color w-100" th:field="*{cor}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{cor}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="tipo">Tipo</label>
                <select class="form-select" th:field="*{tipo}" th:errorclass="is-invalid">
                    <option value="">Escolha...</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{tipo}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="classificacao">Classificação</label>
                <select class="form-select" th:field="*{classificacao}" th:errorclass="is-invalid">
                    <option value="">Escolha...</option>
                    <option th:each="c : ${classificacoes}" th:value="${c}" th:text="${c.rotulo}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{classificacao}"></div>
                <div class="form-text">Receitas = Entrada. Despesas = Necessidade, Desejo ou Poupança.</div>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="icone">Ícone (Bootstrap Icons)</label>
                <div class="input-group">
                    <span class="input-group-text"><i id="previewIcone" class="bi" th:classappend="*{icone}"></i></span>
                    <input type="text" class="form-control" th:field="*{icone}" placeholder="bi-tag"
                           oninput="document.getElementById('previewIcone').className='bi '+this.value">
                </div>
                <div class="form-text">Veja os nomes em <a href="https://icons.getbootstrap.com" target="_blank" rel="noopener">icons.getbootstrap.com</a> (ex.: bi-bus-front, bi-cup-hot).</div>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-gc"><i class="bi bi-check2 me-1"></i>Salvar</button>
            <a th:href="@{/categorias}" class="btn btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
