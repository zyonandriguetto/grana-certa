<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Usuários')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('usuarios')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Usuários</h1>
            <p class="text-secondary mb-0">Jovens cadastrados na plataforma</p>
        </div>
        <a th:href="@{/usuarios/novo}" class="btn btn-gc"><i class="bi bi-person-plus me-1"></i>Novo usuário</a>
    </div>

    <div class="gc-card overflow-hidden">
        <div class="table-responsive">
            <table class="table gc-tabela">
                <thead>
                <tr><th>Usuário</th><th>Idade</th><th>Renda/mesada</th><th>Transações</th><th>Metas</th><th>Pontos</th><th class="text-end">Ações</th></tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="7" class="text-center text-secondary py-4">Nenhum usuário cadastrado.</td></tr>
                <tr th:each="u : ${usuarios}">
                    <td>
                        <a th:href="@{/usuarios/{id}(id=${u.id})}" class="d-flex align-items-center gap-2 text-decoration-none text-reset">
                            <span class="avatar" th:text="${u.avatar}">🙂</span>
                            <span><span class="fw-semibold d-block" th:text="${u.nome}">Nome</span><small class="text-secondary" th:text="${u.email}">email</small></span>
                        </a>
                    </td>
                    <td th:text="${u.idade} + ' anos'">16</td>
                    <td th:text="${@fmt.moeda(u.rendaMensal)}">R$ 0</td>
                    <td th:text="${#lists.size(u.transacoes)}">0</td>
                    <td th:text="${#lists.size(u.metas)}">0</td>
                    <td><span class="chip bg-roxo-suave" th:text="${u.pontuacao}">0</span></td>
                    <td class="text-end acoes">
                        <a th:href="@{/usuarios/{id}(id=${u.id})}" class="btn btn-sm btn-outline-primary" title="Painel"><i class="bi bi-speedometer2"></i></a>
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:replace="~{fragments/layout :: excluir(@{/usuarios/{id}/excluir(id=${u.id})}, ${u.nome})}"></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
