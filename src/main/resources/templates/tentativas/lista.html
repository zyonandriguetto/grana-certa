<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tentativas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Tentativas de quiz</h1>
            <p class="text-secondary mb-0">Gravadas automaticamente ao terminar um quiz (também podem ser lançadas aqui)</p>
        </div>
        <a th:href="@{/tentativas/novo}" class="btn btn-gc"><i class="bi bi-plus-lg me-1"></i>Nova tentativa</a>
    </div>

    <div class="gc-card overflow-hidden">
        <div class="table-responsive">
            <table class="table gc-tabela">
                <thead><tr><th>Quando</th><th>Usuário</th><th>Lição</th><th>Acertos</th><th>Pontos</th><th class="text-end">Ações</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tentativas)}"><td colspan="6" class="text-center text-secondary py-4">Nenhuma tentativa.</td></tr>
                <tr th:each="t : ${tentativas}">
                    <td class="small text-secondary text-nowrap" th:text="${@fmt.dataHora(t.dataHora)}">data</td>
                    <td><a th:href="@{/usuarios/{id}(id=${t.usuario.id})}" class="text-decoration-none" th:text="${t.usuario.avatar} + ' ' + ${t.usuario.nome}">user</a></td>
                    <td><a th:href="@{/licoes/{id}(id=${t.licao.id})}" class="text-decoration-none text-reset" th:text="${t.licao.titulo}">lição</a></td>
                    <td>
                        <span th:text="${t.acertos} + '/' + ${t.totalPerguntas}">x</span>
                        <div class="progress" style="height:6px;width:90px"><div class="progress-bar" th:style="'width:' + ${t.percentual} + '%'"></div></div>
                    </td>
                    <td><span class="chip bg-roxo-suave" th:text="${t.pontos}">0</span></td>
                    <td class="text-end acoes">
                        <a th:href="@{/tentativas/{id}/editar(id=${t.id})}" class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:replace="~{fragments/layout :: excluir(@{/tentativas/{id}/excluir(id=${t.id})}, 'esta tentativa')}"></form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
