<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${licao.titulo})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('licoes')}"></nav>

<main class="container py-4" style="max-width: 820px">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <a th:href="@{/licoes}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Trilha</a>

    <article class="gc-card p-4 p-md-5 mt-2 mb-4">
        <div class="d-flex gap-3 align-items-center mb-4">
            <span class="licao-icone bg-roxo-suave"><i class="bi" th:classappend="${licao.icone}"></i></span>
            <div>
                <small class="text-secondary fw-semibold" th:text="'Lição ' + ${licao.ordem} + ' · ' + ${licao.tema} + ' · ' + ${licao.nivel.rotulo}">tema</small>
                <h1 class="h3 mb-0" th:text="${licao.titulo}">Título</h1>
            </div>
        </div>
        <p class="lead text-secondary" th:text="${licao.resumo}">resumo</p>
        <div class="licao-texto">
            <p th:each="par : ${licao.paragrafos}" th:text="${par}">parágrafo</p>
        </div>
        <p th:if="${licao.fonte}" class="small text-secondary mb-0 mt-4">
            <i class="bi bi-link-45deg"></i> Saiba mais: <a th:href="${licao.fonte}" target="_blank" rel="noopener" th:text="${licao.fonte}">fonte</a>
        </p>
    </article>

    <div class="gc-card p-4 text-center" style="background: linear-gradient(135deg, #f4f2ff, #eafff9)">
        <div class="display-6 mb-2">🧠</div>
        <h2 class="h5">Hora do quiz!</h2>
        <div th:if="${#lists.isEmpty(licao.perguntas)}">
            <p class="text-secondary">Essa lição ainda não tem perguntas.</p>
            <a th:href="@{/perguntas/novo(licaoId=${licao.id})}" class="btn btn-outline-secondary">Cadastrar pergunta</a>
        </div>
        <div th:unless="${#lists.isEmpty(licao.perguntas)}">
            <p class="text-secondary" th:text="${#lists.size(licao.perguntas)} + ' perguntas · 10 pontos por acerto · +20 se gabaritar'">info</p>
            <div th:if="${#lists.isEmpty(usuarios)}" class="text-secondary">Crie um <a th:href="@{/usuarios/novo}">perfil</a> para jogar.</div>
            <form th:unless="${#lists.isEmpty(usuarios)}" th:action="@{/quiz/{id}(id=${licao.id})}" method="get"
                  class="d-flex flex-wrap gap-2 justify-content-center">
                <select name="usuarioId" class="form-select w-auto" required>
                    <option value="">Quem vai jogar?</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.avatar} + ' ' + ${u.nome}"></option>
                </select>
                <button class="btn btn-gc"><i class="bi bi-play-fill me-1"></i>Começar</button>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
