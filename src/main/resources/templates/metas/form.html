<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Meta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('metas')}"></nav>

<main class="container py-4" style="max-width: 720px">
    <a th:href="@{/metas}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Voltar</a>
    <h1 class="h3 mt-2 mb-4" th:text="${meta.id == null} ? 'Nova meta' : 'Editar meta'">Meta</h1>

    <form th:action="@{/metas}" th:object="${meta}" method="post" class="gc-card p-4" novalidate>
        <input type="hidden" th:field="*{id}">
        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger rounded-4">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">erro</div>
        </div>
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label" for="usuarioId">De quem é a meta?</label>
                <select class="form-select" id="usuarioId" name="usuarioId" required>
                    <option value="">Escolha...</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.avatar} + ' ' + ${u.nome}" th:selected="${u.id == usuarioId}"></option>
                </select>
            </div>
            <div class="col-9 col-md-10">
                <label class="form-label" for="titulo">Objetivo</label>
                <input type="text" class="form-control" th:field="*{titulo}" th:errorclass="is-invalid" placeholder="Ex.: Comprar uma bicicleta">
                <div class="invalid-feedback" th:errors="*{titulo}"></div>
            </div>
            <div class="col-3 col-md-2">
                <label class="form-label" for="emoji">Emoji</label>
                <select class="form-select" th:field="*{emoji}">
                    <option th:each="e : ${ {'🎯','💻','📱','🎮','🚲','🛟','✈️','🎤','🎓','🚗','🏠','👟'} }" th:value="${e}" th:text="${e}"></option>
                </select>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="descricao">Descrição <span class="text-secondary fw-normal">(opcional)</span></label>
                <input type="text" class="form-control" th:field="*{descricao}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{descricao}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="valorAlvo">Quanto precisa juntar (R$)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{valorAlvo}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{valorAlvo}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="prazo">Até quando</label>
                <input type="date" class="form-control" th:field="*{prazo}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{prazo}"></div>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-gc"><i class="bi bi-check2 me-1"></i>Salvar</button>
            <a th:href="@{/metas}" class="btn btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
