<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Metas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('metas')}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: alertas}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Metas</h1>
            <p class="text-secondary mb-0">Objetivo com valor e prazo é sonho com plano</p>
        </div>
        <div class="d-flex gap-2">
            <form th:action="@{/metas}" method="get">
                <select name="usuarioId" class="form-select" onchange="this.form.submit()">
                    <option value="">Todos os usuários</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.avatar} + ' ' + ${u.nome}" th:selected="${u.id == usuarioId}"></option>
                </select>
            </form>
            <a th:href="@{/metas/novo(usuarioId=${usuarioId})}" class="btn btn-gc text-nowrap"><i class="bi bi-plus-lg me-1"></i>Nova meta</a>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(metas)}" class="gc-card p-5 text-center text-secondary">Nenhuma meta cadastrada.</div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="m : ${metas}">
            <div class="gc-card gc-card-hover p-4 h-100 d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <span class="meta-emoji" th:text="${m.emoji}">🎯</span>
                    <span th:if="${m.concluida}" class="chip bg-verde-suave"><i class="bi bi-check2-circle"></i> Concluída</span>
                    <span th:if="${!m.concluida and m.diasRestantes < 0}" class="chip bg-vermelho-suave">Prazo vencido</span>
                </div>
                <a th:href="@{/metas/{id}(id=${m.id})}" class="h5 text-decoration-none text-reset fw-bold mb-1" th:text="${m.titulo}">Meta</a>
                <small class="text-secondary mb-3" th:text="${m.usuario.avatar} + ' ' + ${m.usuario.nome} + ' · até ' + ${@fmt.data(m.prazo)}">dono</small>
                <div class="progress mb-2"><div class="progress-bar" th:style="'width:' + ${m.percentual} + '%'"></div></div>
                <div class="d-flex justify-content-between small mb-3">
                    <span class="fw-semibold" th:text="${@fmt.moeda(m.valorAtual)}">R$</span>
                    <span class="text-secondary" th:text="${m.percentual} + '% de ' + ${@fmt.moeda(m.valorAlvo)}">x</span>
                </div>
                <div th:unless="${m.concluida}" class="small bg-roxo-suave rounded-3 p-2 mb-3">
                    <i class="bi bi-calendar-check me-1"></i>Guarde <strong th:text="${@fmt.moeda(m.aporteMensalSugerido)}">R$</strong> por mês para chegar lá.
                </div>
                <div class="mt-auto d-flex gap-2 acoes">
                    <a th:href="@{/transacoes/novo(usuarioId=${m.usuario.id}, metaId=${m.id})}" class="btn btn-sm btn-gc-verde"><i class="bi bi-piggy-bank me-1"></i>Depositar</a>
                    <a th:href="@{/metas/{id}/editar(id=${m.id})}" class="btn btn-sm btn-outline-secondary" title="Editar"><i class="bi bi-pencil"></i></a>
                    <form th:replace="~{fragments/layout :: excluir(@{/metas/{id}/excluir(id=${m.id})}, ${m.titulo})}"></form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
