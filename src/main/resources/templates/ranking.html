<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ranking')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('ranking')}"></nav>

<main class="container py-4" style="max-width: 820px">
    <div class="text-center mb-4">
        <div class="display-4">🏆</div>
        <h1 class="h2">Ranking da trilha</h1>
        <p class="text-secondary">10 pontos por acerto e +20 de bônus por gabaritar um quiz.</p>
    </div>

    <div class="gc-card">
        <div th:if="${#lists.isEmpty(ranking)}" class="p-4 text-center text-secondary">Ninguém pontuou ainda.</div>
        <div class="list-group list-group-flush rounded-4">
            <a th:each="u, it : ${ranking}" th:href="@{/usuarios/{id}(id=${u.id})}"
               class="list-group-item list-group-item-action d-flex align-items-center gap-3 py-3 px-4">
                <span class="medalha" style="width: 40px" th:text="${it.index == 0 ? '🥇' : (it.index == 1 ? '🥈' : (it.index == 2 ? '🥉' : (it.count + 'º')))}">1</span>
                <span class="avatar" th:text="${u.avatar}">🙂</span>
                <div class="flex-grow-1">
                    <div class="fw-semibold" th:text="${u.nome}">Nome</div>
                    <small class="text-secondary" th:text="${#lists.size(u.tentativas)} + ' quiz(zes) respondido(s)'">x</small>
                </div>
                <span class="fs-5 fw-bold text-roxo" th:text="${u.pontuacao} + ' pts'">0</span>
            </a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
