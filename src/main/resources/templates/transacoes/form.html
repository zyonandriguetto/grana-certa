<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transação')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('transacoes')}"></nav>

<main class="container py-4" style="max-width: 760px">
    <a th:href="@{/transacoes}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Voltar</a>
    <h1 class="h3 mt-2 mb-4" th:text="${transacao.id == null} ? 'Nova transação' : 'Editar transação'">Transação</h1>

    <form th:action="@{/transacoes}" th:object="${transacao}" method="post" class="gc-card p-4" novalidate>
        <input type="hidden" th:field="*{id}">
        <input type="hidden" name="voltarPara" th:if="${usuarioId != null and transacao.id == null}" th:value="@{/usuarios/{id}(id=${usuarioId})}">

        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger rounded-4">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">erro</div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label" for="usuarioId">Usuário</label>
                <select class="form-select" id="usuarioId" name="usuarioId" required>
                    <option value="">Escolha...</option>
                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.avatar} + ' ' + ${u.nome}" th:selected="${u.id == usuarioId}"></option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="categoriaId">Categoria</label>
                <select class="form-select" id="categoriaId" name="categoriaId" required>
                    <option value="">Escolha...</option>
                    <optgroup label="Entradas">
                        <option th:each="c : ${categorias}" th:if="${c.tipo.name() == 'RECEITA'}" th:value="${c.id}" th:text="${c.nome}" th:selected="${c.id == categoriaId}"></option>
                    </optgroup>
                    <optgroup label="Saídas">
                        <option th:each="c : ${categorias}" th:if="${c.tipo.name() == 'DESPESA'}" th:value="${c.id}"
                                th:text="${c.nome} + ' (' + ${c.classificacao.rotulo} + ')'" th:selected="${c.id == categoriaId}"></option>
                    </optgroup>
                </select>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="descricao">Descrição</label>
                <input type="text" class="form-control" th:field="*{descricao}" th:errorclass="is-invalid" placeholder="Ex.: Lanche depois da aula">
                <div class="invalid-feedback" th:errors="*{descricao}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="valor">Valor (R$)</label>
                <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{valor}" th:errorclass="is-invalid" placeholder="0,00">
                <div class="invalid-feedback" th:errors="*{valor}"></div>
            </div>
            <div class="col-md-6">
                <label class="form-label" for="data">Data</label>
                <input type="date" class="form-control" th:field="*{data}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{data}"></div>
            </div>
            <div class="col-md-12">
                <label class="form-label" for="metaId">Depositar em uma meta? <span class="text-secondary fw-normal">(opcional)</span></label>
                <select class="form-select" id="metaId" name="metaId">
                    <option value="">Não</option>
                    <option th:each="m : ${metas}" th:value="${m.id}" th:attr="data-usuario=${m.usuario.id}"
                            th:text="${m.emoji} + ' ' + ${m.titulo} + ' (' + ${m.usuario.nome} + ')'" th:selected="${m.id == metaId}"></option>
                </select>
                <div class="form-text">Use uma categoria de saída, como "Poupança / Investimento". O valor entra no progresso da meta.</div>
            </div>
            <div class="col-md-12">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" th:field="*{impulsiva}">
                    <label class="form-check-label" th:for="${#ids.prev('impulsiva')}">Foi uma compra por impulso? <span class="text-secondary">(seja sincero 😅)</span></label>
                </div>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-gc"><i class="bi bi-check2 me-1"></i>Salvar</button>
            <a th:href="@{/transacoes}" class="btn btn-light">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    // Mostra só as metas do usuário escolhido
    const selUsuario = document.getElementById('usuarioId');
    const selMeta = document.getElementById('metaId');
    function filtrarMetas() {
        [...selMeta.options].forEach(o => {
            if (!o.dataset.usuario) return;
            const ok = !selUsuario.value || o.dataset.usuario === selUsuario.value;
            o.hidden = !ok;
            if (!ok && o.selected) selMeta.value = '';
        });
    }
    selUsuario.addEventListener('change', filtrarMetas);
    filtrarMetas();
</script>
</body>
</html>
