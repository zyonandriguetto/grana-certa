spring.application.name=GranaCerta
server.port=${PORT:8080}

# Lê DB_URL, DB_USER e DB_PASS do ambiente ou de um arquivo .env na raiz do projeto
# (copie o .env.example para .env). Variáveis de ambiente têm prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties]

# ===== Supabase (PostgreSQL) =====
# Sem valores padrão de propósito: se faltar alguma, a aplicação avisa na hora de subir.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
# O pooler do Supabase tem limite de conexões por plano: mantenha o pool pequeno.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== HTTP / JSON =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Popular o banco com dados de exemplo na primeira execução (só se estiver vazio)
granacerta.seed=true
