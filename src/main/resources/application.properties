spring.application.name=GranaCerta
server.port=${PORT:8080}

# ===== MySQL (banco oficial do projeto) =====
# Ajuste usuário/senha por variáveis de ambiente ou direto aqui.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/granacerta?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Popular o banco com dados de exemplo na primeira execução
granacerta.seed=true
